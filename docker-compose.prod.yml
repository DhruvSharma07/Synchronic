# Production stack. Only the `web` (Caddy) container is exposed; Postgres, Redis,
# the API and the sync server are reachable only on the internal network.
#
#   cp .env.example .env     # fill POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET, SITE_ADDRESS
#   docker compose -f docker-compose.prod.yml up -d --build
name: synchronic

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-synchronic}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-synchronic}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synchronic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-synchronic}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence keeps refresh-token sessions across restarts.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/server/api
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  sync:
    build: ./apps/server/sync
    restart: unless-stopped
    stop_grace_period: 30s # lets it flush open documents on shutdown
    environment:
      <<: *backend-env
    # Do NOT scale this service: document rooms live in process memory.
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      sync: { condition: service_healthy }

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
