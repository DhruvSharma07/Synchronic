name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r apps/server/api/requirements.txt
          pip install -r apps/server/sync/requirements.txt
      - name: Compile
        run: python -m compileall -q apps/server
      - name: API tests
        working-directory: apps/server/api
        run: python -m unittest discover -s tests -t .
      - name: Sync tests
        working-directory: apps/server/sync
        run: python -m unittest discover -s tests -t .
      - name: Role logic stays identical across services
        run: diff apps/server/api/roles.py apps/server/sync/roles.py

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: apps/client
        run: npm install
      - name: Typecheck and build
        working-directory: apps/client
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, client]
    env:
      POSTGRES_PASSWORD: ci
      REDIS_PASSWORD: ci
      JWT_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        run: |
          cp .env.example .env   # dev compose reads env_file: .env (gitignored, so absent in CI)
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
